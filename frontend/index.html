<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBank - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>MiniBank</h1>
        <p>Simple. Secure. Smart Banking.</p>
    </div>

    <div class="card">

        <h2>Welcome Back</h2>

        <form id="loginForm">

            <label>Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage" class="message"></p>

        <p class="switch">
            New to MiniBank?
            <a href="register.html">Create account</a>
        </p>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
