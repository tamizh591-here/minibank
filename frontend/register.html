<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBank - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>MiniBank</h1>
        <p>Create your MiniBank profile</p>
    </div>

    <div class="card">

        <h2>Create Account</h2>

        <form id="registerForm">

            <label>First Name</label>
            <input
                type="text"
                id="firstName"
                required
            >

            <label>Last Name</label>
            <input
                type="text"
                id="lastName"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="registerEmail"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="registerPassword"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="registerMessage" class="message"></p>

        <p class="switch">
            Already registered?
            <a href="index.html">Login</a>
        </p>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
